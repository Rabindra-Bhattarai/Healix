services:
  mongo:
    image: mongo:7
    container_name: healix-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - healix-mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: healix-backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/healix
      CORS_ORIGIN: http://localhost:3001,https://localhost:3001,http://localhost:3000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_FACEBOOK_APP_ID: ${NEXT_PUBLIC_FACEBOOK_APP_ID}
    container_name: healix-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:3000"

volumes:
  healix-mongo-data:
